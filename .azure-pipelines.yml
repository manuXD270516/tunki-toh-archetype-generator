trigger:
  branches:
    include:
      - main
  paths:
    include:
      - sip-toh-parent/**
      - sip-core-client/**
      - sip-exception-handler/**
      - sip-endpoint-timeout/**
      - sip-toh-archetype/**
      - pom.xml

pool:
  vmImage: 'ubuntu-latest'

variables:
  MAVEN_OPTS: '-Dmaven.repo.local=$(Pipeline.Workspace)/.m2/repository'
  FEED_NAME: 'BackendArtifactsInDigitalpePro@Local'

stages:
  - stage: Build
    displayName: 'Build & Test Platform Libs'
    jobs:
      - job: BuildAndTest
        steps:
          - task: MavenAuthenticate@0
            displayName: 'Authenticate to Azure Artifacts'
            inputs:
              artifactsFeeds: '$(FEED_NAME)'

          - task: Maven@4
            displayName: 'Build all modules (reactor)'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean verify'
              options: '-B'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.21'

  - stage: Publish
    displayName: 'Publish to Azure Artifacts'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Deploy
        steps:
          - task: MavenAuthenticate@0
            displayName: 'Authenticate to Azure Artifacts'
            inputs:
              artifactsFeeds: '$(FEED_NAME)'

          - task: Maven@4
            displayName: 'Deploy parent POM'
            inputs:
              mavenPomFile: 'sip-toh-parent/pom.xml'
              goals: 'deploy'
              options: '-B -DskipTests'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.21'

          - task: Maven@4
            displayName: 'Deploy shared libs + archetype'
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'deploy'
              options: '-B -DskipTests -pl sip-core-client,sip-exception-handler,sip-endpoint-timeout,sip-toh-archetype'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.21'
