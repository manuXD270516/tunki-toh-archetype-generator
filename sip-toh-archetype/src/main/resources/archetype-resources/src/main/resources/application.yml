#set( $symbol_dollar = '$' )
spring:
  application:
    name: ${msName}
  threads:
    virtual:
      enabled: true

  data:
    mongodb:
      uri: mongodb://${symbol_dollar}{MONGO_HOST:localhost}:27017/${dbName}?replicaSet=rs0
      auto-index-creation: false

    redis:
      host: ${symbol_dollar}{REDIS_HOST:localhost}
      port: ${symbol_dollar}{REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /${msName}

logging:
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %X{traceId:-} %X{spanId:-} - %msg%n"
  level:
    pe.oh.sip: INFO
    org.springframework.data.mongodb: WARN

# Core service URLs
core:
  services:
    customer:
      url: ${symbol_dollar}{CORE_CUSTOMER_URL:http://localhost:8081}
    account:
      url: ${symbol_dollar}{CORE_ACCOUNT_URL:http://localhost:8082}
    operation:
      url: ${symbol_dollar}{CORE_OPERATION_URL:http://localhost:8083}
    user:
      url: ${symbol_dollar}{CORE_USER_URL:http://localhost:8084}
    notification:
      url: ${symbol_dollar}{CORE_NOTIFICATION_URL:http://localhost:8085}
    cache:
      url: ${symbol_dollar}{CORE_CACHE_URL:http://localhost:8086}

# Resilience4j
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallDurationThreshold: 5s
        slowCallRateThreshold: 80
    instances:
      coreCustomer:
        baseConfig: default
      coreAccount:
        baseConfig: default
      coreCache:
        baseConfig: default

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.net.SocketTimeoutException
          - java.net.ConnectException
    instances:
      coreCustomer:
        baseConfig: default
      coreAccount:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
    instances:
      coreCustomer:
        timeoutDuration: 5s
      coreAccount:
        timeoutDuration: 5s
